version: 2

# Alerts, not pull requests.
#
# `open-pull-requests-limit: 0` disables version updates for an ecosystem while
# keeping it declared, so Dependabot still knows what this repository depends on
# and re-enabling is a one-line change per entry. Nothing here opens a PR or an
# issue.
#
# Two switches this file does *not* control, both under
# Settings -> Code security:
#
#   * **Dependabot alerts** — the notifications this repo wants. Turn ON.
#   * **Dependabot security updates** — opens a PR per vulnerable dependency.
#     Turn OFF: it is a repository setting, and `open-pull-requests-limit` does
#     not apply to it, so leaving it on would still produce the PRs this file is
#     here to prevent.
updates:
  # uv.lock and pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
