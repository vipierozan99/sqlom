name: Benchmarks (periodic)

# Explores the three-step idea in the task: (1) has main moved since we last
# benchmarked, (2) if so run the benchmarks, (3) post the result somewhere.
#
# Posts to a single tracking issue (one comment per run). That same issue is
# also the change-detection state: step (1) skips when a comment already exists
# for main's current commit, so there is no separate marker to drift.
#
# **Only main publishes.** Dispatching this against a WIP branch runs the same
# suite and leaves the full output in the run itself — step summary plus an
# artifact — without commenting anywhere. The tracking issue is a trend line for
# the default branch, and a branch comment would both break that reading and
# poison step (1), whose state *is* those comments.
#
# Caveat baked into the output: GitHub-hosted runners are shared and unpinned,
# so these numbers are a *trend / regression* signal, not a quotable baseline
# (docs/METHODOLOGY.md: absolutes drift with the machine). The in-process micro
# suite is used precisely because it has the best signal-to-noise here — no
# docker, no event-loop/pool/TLS.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if this commit was already benchmarked (main only; branches always run)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  # Per ref, so dispatching a WIP branch neither queues behind the daily main
  # run nor cancels it. Serialising every branch against main bought nothing:
  # each run gets its own runner, and only main touches the issue.
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.11"
  GH_TOKEN: ${{ github.token }}
  TRACKING_TITLE: "Benchmark trend (automated)"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `gh` authenticates through GH_TOKEN below, and the only git command
          # here is a local `rev-parse`, so the checkout token does not need to
          # stay in .git/config.
          #
          # No `ref:` — checkout defaults to the ref that triggered the run, so a
          # dispatch benchmarks the branch you picked. It used to pin `main`,
          # which meant dispatching against a branch silently measured main.
          persist-credentials: false

      # (1) Change detection, and whether this run may publish. Only main does:
      # the tracking issue is main's trend line, and its comments are the state
      # this step reads, so a branch writing there would corrupt both.
      - name: Resolve ref and detect change
        id: detect
        run: |
          SHORT=$(git rev-parse --short HEAD)
          REF="${{ github.ref_name }}"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          # Artifact names reject "/", which branch names routinely contain.
          echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            {
              echo "Running against \`$REF\` @ \`$SHORT\` — **results stay in this run**"
              echo "(step summary below, plus the \`bench-logs\` artifact). Only \`main\` comments"
              echo "on the tracking issue."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                --jq "map(select(.title==\"$TRACKING_TITLE\"))|.[0].number // empty")
          echo "issue=$NUM" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force }}" != "true" ] && [ -n "$NUM" ] \
             && gh issue view "$NUM" --json comments \
                  --jq '.comments[].body' | grep -qF "main @ \`$SHORT\`"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main @ \`$SHORT\` already benchmarked — skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.detect.outputs.run == 'true'
        # Pinned exactly, unlike the other actions here: astral-sh/setup-uv
        # publishes floating major tags only up to v7, so `@v9` does not
        # resolve at all. Bump this by hand.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # (2) Run the benchmarks. Called directly rather than via `just bench` so
      # the empty `--pin ""` survives — `just`'s {{args}} re-tokenisation would
      # drop the empty token and bind `--pin` to the next flag. `--pin ""`
      # disables CPU pinning (the local default targets cores that don't exist
      # on a 2-core runner).
      - name: Run micro benchmarks
        if: steps.detect.outputs.run == 'true'
        run: |
          set -o pipefail
          for shape in flat join wide; do
            uv run --all-groups python -m benchmarks micro run \
              --shape "$shape" --pin "" 2>&1 | tee "bench-$shape.log"
          done

      - name: Build report
        if: steps.detect.outputs.run == 'true'
        run: |
          {
            echo "# Benchmark run — ${{ steps.detect.outputs.ref }} @ \`${{ steps.detect.outputs.short }}\`"
            echo
            echo "> Runner: GitHub-hosted \`ubuntu-latest\` — shared and unpinned."
            echo "> **Not a quotable baseline**; read as a trend / regression signal only."
            echo
            for shape in flat join wide; do
              echo "## micro / $shape"
              echo '```'
              cat "bench-$shape.log"
              echo '```'
              echo
            done
          } | tee SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      # The full output, retrievable without scrolling the log — and the only
      # durable copy for a branch run, which posts nowhere.
      - name: Upload benchmark logs
        if: steps.detect.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs-${{ steps.detect.outputs.slug }}-${{ steps.detect.outputs.short }}
          path: |
            bench-*.log
            SUMMARY.md
          if-no-files-found: error

      # (3) Post to the tracking issue — main only, creating it on the
      # first-ever run. The header line above carries the short sha that step
      # (1) greps for.
      - name: Post results to the tracking issue
        if: steps.detect.outputs.run == 'true' && steps.detect.outputs.publish == 'true'
        run: |
          NUM="${{ steps.detect.outputs.issue }}"
          if [ -z "$NUM" ]; then
            URL=$(gh issue create --title "$TRACKING_TITLE" --body \
              "Automated benchmark trend — one comment per run of the in-process micro suite on a GitHub-hosted runner (shared, unpinned: a trend signal, **not** a quotable baseline).")
            NUM=$(basename "$URL")
          fi
          gh issue comment "$NUM" --body-file SUMMARY.md
          echo "Posted to issue #$NUM." >> "$GITHUB_STEP_SUMMARY"
