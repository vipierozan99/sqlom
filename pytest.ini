[pytest]
testpaths = tests
# auto mode: any `async def test_*` is collected and run without needing a
# per-test @pytest.mark.asyncio decorator.
asyncio_mode = auto
# Each test gets its own loop. The engines hold pools bound to the loop that
# opened them, so sharing a loop across tests would let one test's closed pool
# be observed by another.
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
markers =
    postgres: needs a reachable PostgreSQL server (skipped otherwise)
    typing: shells out to mypy/pyright; slower than the rest (skipped if absent)
# tests/typing/ holds files that are checked, never imported. Collecting them would
# execute their deliberate type errors. Setting this *replaces* pytest's default
# ignores rather than extending them, so the generated directories that matter here
# have to be named too — `.hypothesis` is the example database written by
# tests/test_property_hydration.py.
norecursedirs = tests/typing .hypothesis .venv
