[project]
name = "rowform"
version = "0.1.0"
description = "Zero-overhead async data layer for Python: a statically-typed query builder over asyncpg/psycopg, with compiled hydration and orjson serialization."
readme = "README.md"
requires-python = ">=3.11"
# SQLAlchemy is a hard, unconditional dependency: it compiles every statement and
# owns the schema (docs/PLAN_CORE_COMPILER.md §1a). There is no standalone mode.
dependencies = ["sqlalchemy>=2.0"]

[project.optional-dependencies]
asyncpg = ["asyncpg>=0.29"]
psycopg = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
sqlite = ["aiosqlite>=0.19"]
orjson = ["orjson>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "aiosqlite>=0.19",
    "alembic>=1.18.5",
    "async-typer>=0.2.1",
    "asyncpg>=0.29",
    "basedpyright>=1.39.9",
    "coverage>=7.15.2",
    "orjson>=3.9",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "rich>=15.0.0",
    "ruff>=0.16.0",
]

# Contenders and load generators. Kept out of `dev` so a plain `uv sync` does not
# pull SQLAlchemy/FastAPI, but declared so that `just bench` is reproducible —
# previously these were a manual `pip install` line in docs/METHODOLOGY.md.
bench = [
    "fastapi>=0.115",
    "locust>=2.32",
    "psutil>=6.0",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    # async-typer 0.2.1 imports `typer.clear`, removed in typer 0.26 — cap until
    # async-typer publishes a release that drops it (see PLAN.md discoveries).
    "typer>=0.15,<0.26",
    "uvicorn[standard]>=0.34",
]

profile = [
    "austin-dist>=3.6",
    # provides the `austin2speedscope` converter (the `austin` sampler binary
    # itself, from austin-dist, only writes its binary "mojo" format).
    "austin-python>=2.2",
    "py-spy>=0.4.2",
    "pyinstrument>=5.0",
    "yappi>=1.6.10",
]


[tool.pyright]
typeCheckingMode = "standard"
enableExperimentalFeatures = true
reportIncompatibleVariableOverride = false
reportIncompatibleMethodOverride = false
reportUnnecessaryTypeIgnoreComment = "error"
include = ["rowform", "benchmarks", "tests/typing"]
extraPaths = ["."]


[tool.ruff]
line-length = 100
preview = true

[tool.ruff.lint]
extend-select = ["E303", "TID", "S"]
ignore = [
    "E711",
    "PLC0414",
    "B008",
    "S101",    # assert is this codebase's idiom for internal invariants/type-narrowing, never auth/permission checks
]
task-tags = ["TODO", "FIXME", "XXX", "NOTE"]

[tool.ruff.lint.per-file-ignores]
# Dev-only scripts, never shipped or run against untrusted input: hardcoded table
# names and exec() are the same codegen the library itself uses (see rowform/compile.py),
# random.Random seeds synthetic benchmark data, and subprocess/except-Exception calls
# drive or clean up after local, hardcoded commands rather than user input.
"benchmarks/**" = ["DTZ001", "S102", "S110", "S311", "S404", "S603", "S607", "S608", "BLE001", "PLW1510"]
# Naive datetimes are the point, not an oversight: sqlite stores DATETIME as a
# string with no zone, and the type-fidelity tests assert exactly what comes back.
# RUF012 fires on `metadata = MetaData()`, which is how a Base is declared.
# The subprocess call runs `uv run basedpyright` on a hardcoded path.
"tests/**" = ["DTZ001", "RUF012", "S404", "S603", "S607"]
# Deliberate mistakes, each asserted by a `# pyright: ignore` the checker
# verifies is necessary. The assignment *is* the assertion, so it is never read.
"tests/typing/negative.py" = ["B015", "B018", "F841", "RUF059"]
