[project]
name = "rowform"
version = "0.1.0"
description = "Zero-overhead async data layer for Python: a statically-typed query builder over asyncpg/psycopg, with compiled hydration and orjson serialization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
asyncpg = ["asyncpg>=0.29"]
psycopg = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
orjson = ["orjson>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "asyncpg>=0.29",
    "basedpyright>=1.39.9",
    "coverage>=7.15.2",
    "orjson>=3.9",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]


[tool.pyright]
typeCheckingMode = "standard"
enableExperimentalFeatures = true
reportIncompatibleVariableOverride = false
reportIncompatibleMethodOverride = false
reportUnnecessaryTypeIgnoreComment = "error"
include = ["rowform", "tests/typing"]
extraPaths = ["."]


[tool.ruff]
line-length = 100
preview = true

[tool.ruff.lint]
extend-select = ["E303", "TID", "S"]
ignore = [
    "E711",
    "PLC0414",
    "B008",
    "S101",    # assert is this codebase's idiom for internal invariants/type-narrowing, never auth/permission checks
]
task-tags = ["TODO", "FIXME", "XXX", "NOTE"]

[tool.ruff.lint.per-file-ignores]
# Dev-only scripts, never shipped or run against untrusted input: hardcoded table
# names and exec() are the same codegen the library itself uses (see rowform/compile.py),
# random.Random seeds synthetic benchmark data, and subprocess/except-Exception calls
# drive or clean up after local, hardcoded commands rather than user input.
"benchmarks/*" = ["S102", "S110", "S311", "S404", "S603", "S607", "S608", "BLE001", "PLW1510"]
